name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck and ruff
        run: |
          brew install shellcheck
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "ruff==0.15.12"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh tests/*.sh
      - name: ruff
        run: ruff check .
      - name: Published checksums are current
        run: python3 scripts/update_checksums.py --check
      - name: Test suite (temporary HOME, no network)
        run: bash tests/test_install.sh

  end-to-end:
    name: Real install of the office group (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the source tarball the bootstrapper would download
        run: git archive --format=tar.gz --prefix=craft-studio-setup-ci/ -o "$RUNNER_TEMP/source.tar.gz" HEAD
      - name: Install the office group through the piped bootstrapper (temporary HOME)
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          export CRAFT_SETUP_TARBALL="$RUNNER_TEMP/source.tar.gz"
          bash -s -- microsoft --yes --both < install.sh
      - name: Verify every MCP server starts and lists its tools
        run: |
          export HOME="$RUNNER_TEMP/home"
          bash scripts/install.sh microsoft --verify-mcp
      - name: Check the Claude Desktop config and the workspace .mcp.json
        run: |
          export HOME="$RUNNER_TEMP/home"
          python3 - <<'EOF'
          import json, os, pathlib
          home = pathlib.Path(os.environ["HOME"])
          office = {"pdfcraft", "wordcraft", "gridcraft", "deckcraft", "designcraft", "figcraft", "cadcraft"}
          desktop = home / "Library/Application Support/Claude/claude_desktop_config.json"
          workspace = home / "craft-workspace/.mcp.json"
          for path in (desktop, workspace):
              servers = json.loads(path.read_text())["mcpServers"]
              assert set(servers) == office, (path, sorted(servers))
              for entry in servers.values():
                  assert pathlib.Path(entry["command"]).is_file(), entry
          print("configs OK")
          EOF
      - name: A second run changes nothing
        run: |
          export HOME="$RUNNER_TEMP/home"
          bash scripts/install.sh microsoft --yes --both | tee "$RUNNER_TEMP/second.txt"
          grep -q "Already installed, nothing changed." "$RUNNER_TEMP/second.txt"
      - name: Uninstall removes what was added
        run: |
          export HOME="$RUNNER_TEMP/home"
          bash scripts/uninstall.sh --yes
          test ! -e "$HOME/tools/craft"
          test ! -e "$HOME/Library/Application Support/Claude/claude_desktop_config.json"
          test ! -e "$HOME/craft-workspace/.mcp.json"
          test -z "$(find "$HOME/.local/bin" -name '*-cli' 2>/dev/null)"
